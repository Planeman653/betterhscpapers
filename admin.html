<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Admin — Better HSC Papers</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/firebase-config.js"></script>
<script defer src="assets/render.js"></script>
<script type="module" src="assets/auth.js"></script>
<script defer src="assets/admin.js"></script>
</head>
<body class="admin-page">
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="index.html"><img class="brand-mark" src="assets/logo.svg" alt="" width="24" height="24">Better <span>HSC Papers</span></a>
  <nav class="tabs"><a href="standard2.html">Standard 2</a><a href="advanced.html">Advanced</a><a href="extension1.html">Extension 1</a><a href="extension2.html">Extension 2</a><a href="physics.html">Physics</a><a href="chemistry.html">Chemistry</a><a href="biology.html">Biology</a><a href="submit.html" class="submit-tab">+ Submit a question</a><a href="upload.html" class="submit-tab">⬆ Upload a paper</a></nav>
</div></header>

<main class="admin">
  <div class="doc-head"><h1>Admin inbox</h1><p class="soft" id="who">Checking your account…</p></div>
  <div id="gate" class="signin-banner" hidden></div>
  <div id="panel" hidden>
    <div class="chips" id="atabs">
      <button type="button" class="chip on" data-tab="flags">Reports <b id="n-flags"></b></button>
      <button type="button" class="chip" data-tab="subs">Community questions <b id="n-subs"></b></button>
      <button type="button" class="chip" data-tab="queue">Queue <b id="n-queue"></b></button>
      <button type="button" class="chip" data-tab="edits">Edited &amp; deleted <b id="n-edits"></b></button>
    </div>
    <div class="row" style="margin:10px 0"><select id="acourse"><option value="">All subjects</option><option value="standard2">Standard 2</option><option value="advanced">Advanced</option><option value="extension1">Extension 1</option><option value="extension2">Extension 2</option><option value="physics">Physics</option><option value="chemistry">Chemistry</option><option value="biology">Biology</option></select>
      <label class="switch" id="show-resolved-l"><input type="checkbox" id="show-resolved"> Show resolved reports</label><span style="flex:1"></span><button type="button" class="btn" id="reload">Refresh</button></div>
    <div id="list"></div>
  </div>
</main>
<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;z-index:60;font-size:14px"></div>
</body>
</html>
