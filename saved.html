<body class="admin-page">
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="index.html"><img class="brand-mark" src="assets/logo.svg" alt="" width="24" height="24">Better <span>HSC Papers</span></a>
  <nav class="tabs"><a href="standard2.html">Standard 2</a><a href="advanced.html">Advanced</a><a href="extension1.html">Extension 1</a><a href="extension2.html">Extension 2</a><a href="physics.html">Physics</a><a href="chemistry.html">Chemistry</a><a href="biology.html">Biology</a><a href="submit.html" class="submit-tab">+ Submit a question</a></nav>
</div></header>

<main class="admin saved-page">
  <div class="doc-head"><h1>★ Saved questions</h1><p class="soft">Your own question bank. Save questions with the ☆ Save button on any subject page.</p></div>
  <div id="gate" class="signin-banner" hidden></div>
  <div class="row" id="saved-tools" hidden><div class="chips" id="saved-courses"></div><span style="flex:1"></span><label class="switch"><input type="checkbox" id="saved-answers"> Show all answers</label><button type="button" class="btn primary" id="pdf-open">Make a PDF</button></div>
  <div class="pdf-box" id="pdf-box" hidden>
    <div class="field-row">
      <div class="field grow"><label class="lab" for="pdf-title">Title</label><input type="text" id="pdf-title" placeholder="Saved questions"></div>
      <div class="field"><label class="lab" for="pdf-answers">Answers</label><select id="pdf-answers"><option value="end">Answer key at the end</option><option value="inline">Under each question</option><option value="none">No answers</option></select></div>
      <div class="field"><label class="lab" for="pdf-space">Working space</label><select id="pdf-space"><option value="none">None</option><option value="s">Small</option><option value="l">Large</option></select></div>
      <div class="field"><label class="lab" for="pdf-order">Order</label><select id="pdf-order"><option value="subject">By subject and syllabus</option><option value="diff">Easy → hard</option></select></div>
    </div>
    <div class="row"><label class="switch"><input type="checkbox" id="pdf-src" checked> Show source of each question</label><span style="flex:1"></span><span class="soft" id="pdf-count"></span><button type="button" class="btn primary" id="make-pdf">Generate PDF</button></div>
  </div>
  <div id="saved"></div>
</main>
<div id="print-root"></div>
<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;z-index:60;font-size:14px"></div>
</body>
</html>
